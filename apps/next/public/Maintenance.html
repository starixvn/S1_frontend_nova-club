        <div class="text-title">HỆ THỐNG ĐANG BẢO TRÌ</div>
      </div>
      <div class="text-subtitle">
        Trang web hiện không truy cập được do bảo trì
      </div>
      <p class="text-content">
        Quý khách hàng thân mến,
        <br />Hệ thống của chúng tôi hiện đang bảo trì để nâng cấp trải nghiệm
        cho quý khách. Vui lòng truy cập lại sau. <br />Sự kiên nhẫn, thông cảm,
        và ủng hộ của quý khách là món quà quý giá với chúng tôi.
      </p>
